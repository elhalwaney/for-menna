<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>I LOVE YOU MENNA</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #090106;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #replayBtn {
      position: fixed;
      bottom: max(22px, env(safe-area-inset-bottom, 22px));
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 26px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: rgba(255, 42, 109, 0.25);
      border: 1px solid rgba(255, 77, 136, 0.75);
      border-radius: 50px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.2s ease, background 0.2s ease;
      z-index: 10;
    }

    #replayBtn.visible {
      opacity: 1;
      pointer-events: auto;
    }

    #replayBtn:active {
      transform: translateX(-50%) scale(0.95);
      background: rgba(255, 42, 109, 0.45);
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <button id="replayBtn">إعادة العرض ↻</button>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const replayBtn = document.getElementById('replayBtn');

    let width = 0;
    let height = 0;
    let dpr = 1;

    const PALETTE = [
      '#ff1e56',
      '#ff4d88',
      '#ff6b9d',
      '#ff0a54',
      '#ff85a1',
      '#ff3366'
    ];

    const heartSprites = [];
    const SPRITE_SIZE = 32;

    function createHeartSprites() {
      heartSprites.length = 0;
      PALETTE.forEach(color => {
        const off = document.createElement('canvas');
        off.width = SPRITE_SIZE;
        off.height = SPRITE_SIZE;
        const octx = off.getContext('2d');

        const cx = SPRITE_SIZE / 2;
        const cy = SPRITE_SIZE / 2;
        const s = 12;

        octx.save();
        octx.translate(cx, cy - s * 0.15);
        octx.fillStyle = color;
        octx.beginPath();
        octx.moveTo(0, s * 0.35);
        octx.bezierCurveTo(-s * 0.65, -s * 0.4, -s * 1.25, s * 0.25, 0, s * 1.15);
        octx.bezierCurveTo(s * 1.25, s * 0.25, s * 0.65, -s * 0.4, 0, s * 0.35);
        octx.fill();

        octx.fillStyle = 'rgba(255, 255, 255, 0.65)';
        octx.beginPath();
        octx.arc(-s * 0.32, s * 0.15, s * 0.16, 0, Math.PI * 2);
        octx.fill();
        octx.restore();

        heartSprites.push(off);
      });
    }

    let state = 'gather';
    let stateStartTime = 0;
    let particles = [];
    let heartTargets = [];
    let textTargets = [];

    const pointer = { x: -9999, y: -9999, active: false };

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = document.documentElement.clientWidth || window.innerWidth;
      height = document.documentElement.clientHeight || window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    // توليد نقاط تملأ القلب بالكامل من الداخل وحتى الحواف
    function generateFilledHeartPoints(count) {
      const pts = [];
      const isPortrait = height > width;
      // ضبط حجم القلب ليكون مناسباً لعرض شاشة الموبايل دون أن يخرج من الجوانب
      const baseDim = isPortrait ? width * 0.84 : Math.min(width, height) * 0.72;
      const scale = baseDim / 34;
      const cx = width * 0.5;
      const cy = height * 0.46;

      // أخذ عينات داخل مساحة القلب بالكامل لضمان امتلائه بالتساوي
      let attempts = 0;
      while (pts.length < count && attempts < count * 25) {
        attempts++;
        // إحداثيات معيارية من -1.25 إلى 1.25
        const nx = (Math.random() * 2 - 1) * 1.25;
        const ny = (Math.random() * 2 - 1) * 1.25;

        // معادلة القلب الممتلئ: (x^2 + y^2 - 1)^3 - x^2 * y^3 <= 0
        const a = nx * nx + ny * ny - 1;
        if (a * a * a - nx * nx * (ny * ny * ny) <= 0) {
          pts.push({
            x: cx + nx * 14 * scale,
            y: cy - ny * 14 * scale
          });
        }
      }

      // إضافة حدود خارجية واضحة للقلب لزيادة الدقة
      const borderCount = Math.floor(count * 0.18);
      for (let i = 0; i < borderCount && pts.length > 0; i++) {
        const t = (i / borderCount) * Math.PI * 2;
        const hx = 16 * Math.pow(Math.sin(t), 3);
        const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        pts[i] = {
          x: cx + hx * (scale * 0.88),
          y: cy + hy * (scale * 0.88) - scale * 1.2
        };
      }

      return pts;
    }

    // استخراج إحداثيات النص متجاوبة تماماً مع عرض شاشة الموبايل
    function generateTextPoints() {
      const off = document.createElement('canvas');
      off.width = width;
      off.height = height;
      const octx = off.getContext('2d');

      octx.fillStyle = '#000';
      octx.fillRect(0, 0, width, height);
      octx.fillStyle = '#fff';
      octx.textAlign = 'center';
      octx.textBaseline = 'middle';

      const isPortrait = height > width;
      // ضبط مقاس الخط بحيث لا يتجاوز 88% من عرض الشاشة أبداً
      let topSize = isPortrait ? Math.floor(width * 0.115) : Math.min(72, Math.floor(width * 0.06));
      let bottomSize = isPortrait ? Math.floor(width * 0.19) : Math.min(130, Math.floor(width * 0.11));

      octx.font = `900 ${topSize}px "Arial Black", Impact, sans-serif`;
      while (octx.measureText('I LOVE YOU').width > width * 0.86 && topSize > 16) {
        topSize -= 2;
        octx.font = `900 ${topSize}px "Arial Black", Impact, sans-serif`;
      }
      octx.fillText('I LOVE YOU', width * 0.5, isPortrait ? height * 0.39 : height * 0.38);

      octx.font = `900 ${bottomSize}px "Arial Black", Impact, sans-serif`;
      while (octx.measureText('MENNA').width > width * 0.88 && bottomSize > 22) {
        bottomSize -= 2;
        octx.font = `900 ${bottomSize}px "Arial Black", Impact, sans-serif`;
      }
      octx.fillText('MENNA', width * 0.5, isPortrait ? height * 0.53 : height * 0.55);

      const imgData = octx.getImageData(0, 0, width, height).data;
      const pts = [];
      const step = width < 600 ? 4 : 5;

      for (let y = 0; y < height; y += step) {
        for (let x = 0; x < width; x += step) {
          const idx = (y * width + x) * 4;
          if (imgData[idx] > 128) {
            pts.push({ x, y });
          }
        }
      }

      for (let i = pts.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pts[i], pts[j]] = [pts[j], pts[i]];
      }

      return pts;
    }

    function initSimulation() {
      replayBtn.classList.remove('visible');
      textTargets = generateTextPoints();

      const isMobile = width < 600;
      const maxParticles = isMobile ? 850 : 1250;
      const count = Math.min(maxParticles, Math.max(550, textTargets.length));
      heartTargets = generateFilledHeartPoints(count);

      particles = [];
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.max(width, height) * (0.65 + Math.random() * 0.45);
        const startX = width * 0.5 + Math.cos(angle) * dist;
        const startY = height * 0.5 + Math.sin(angle) * dist;

        const tTarget = textTargets[i % textTargets.length];
        const hTarget = heartTargets[i % heartTargets.length];

        particles.push({
          x: startX,
          y: startY,
          vx: 0,
          vy: 0,
          hx: hTarget.x,
          hy: hTarget.y,
          tx: tTarget.x,
          ty: tTarget.y,
          spriteIdx: i % heartSprites.length,
          size: isMobile ? (9 + Math.random() * 4) : (12 + Math.random() * 6),
          delay: Math.random() * 550,
          magnetStrength: 0.045 + Math.random() * 0.035,
          friction: 0.84 + Math.random() * 0.04,
          phase: Math.random() * Math.PI * 2
        });
      }

      state = 'gather';
      stateStartTime = performance.now();
    }

    function triggerExplosion() {
      state = 'explode';
      stateStartTime = performance.now();
      const cx = width * 0.5;
      const cy = height * 0.46;

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const dx = p.x - cx + (Math.random() - 0.5) * 18;
        const dy = p.y - cy + (Math.random() - 0.5) * 18;
        const angle = Math.atan2(dy, dx);
        const force = (width < 600 ? 8 : 13) + Math.random() * 14;

        p.vx = Math.cos(angle) * force;
        p.vy = Math.sin(angle) * force;
      }
    }

    function updateAndDraw(now) {
      const elapsed = now - stateStartTime;

      ctx.fillStyle = '#090106';
      ctx.fillRect(0, 0, width, height);

      if (state === 'gather' && elapsed > 2300) {
        state = 'beat';
        stateStartTime = now;
      } else if (state === 'beat' && elapsed > 1800) {
        triggerExplosion();
      } else if (state === 'explode' && elapsed > 850) {
        state = 'magnet';
        stateStartTime = now;
        setTimeout(() => {
          if (state === 'magnet') replayBtn.classList.add('visible');
        }, 1600);
      }

      let beatScale = 1;
      if (state === 'beat') {
        const t = (elapsed % 900) / 900;
        const pulse1 = Math.exp(-Math.pow((t - 0.18) * 14, 2)) * 0.15;
        const pulse2 = Math.exp(-Math.pow((t - 0.42) * 16, 2)) * 0.10;
        beatScale = 1 + pulse1 + pulse2;
      }

      const cx = width * 0.5;
      const cy = height * 0.46;

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];

        if (state === 'gather') {
          if (elapsed > p.delay) {
            p.x += (p.hx - p.x) * 0.068;
            p.y += (p.hy - p.y) * 0.068;
          }
        } else if (state === 'beat') {
          const targetX = cx + (p.hx - cx) * beatScale;
          const targetY = cy + (p.hy - cy) * beatScale;
          p.x += (targetX - p.x) * 0.25;
          p.y += (targetY - p.y) * 0.25;
        } else if (state === 'explode') {
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.94;
          p.vy *= 0.94;
          p.vy += 0.12;
        } else if (state === 'magnet') {
          const dx = p.tx - p.x;
          const dy = p.ty - p.y;
          const dist = Math.hypot(dx, dy);

          const pull = dist < 90 ? p.magnetStrength * 1.45 : p.magnetStrength;
          p.vx += dx * pull;
          p.vy += dy * pull;

          if (pointer.active) {
            const pdx = p.x - pointer.x;
            const pdy = p.y - pointer.y;
            const pdist = Math.hypot(pdx, pdy);
            if (pdist < 80 && pdist > 0.1) {
              const push = (80 - pdist) * 0.14;
              p.vx += (pdx / pdist) * push;
              p.vy += (pdy / pdist) * push;
            }
          }

          p.vx *= p.friction;
          p.vy *= p.friction;
          p.x += p.vx;
          p.y += p.vy;
        }

        const pulseSize = state === 'magnet'
          ? p.size + Math.sin(now * 0.004 + p.phase) * 1.0
          : p.size;

        const half = pulseSize * 0.5;
        ctx.drawImage(
          heartSprites[p.spriteIdx],
          p.x - half,
          p.y - half,
          pulseSize,
          pulseSize
        );
      }

      requestAnimationFrame(updateAndDraw);
    }

    window.addEventListener('pointermove', e => {
      pointer.x = e.clientX;
      pointer.y = e.clientY;
      pointer.active = true;
    });

    window.addEventListener('pointerdown', e => {
      pointer.x = e.clientX;
      pointer.y = e.clientY;
      pointer.active = true;
    });

    window.addEventListener('pointerup', () => {
      pointer.active = false;
    });

    replayBtn.addEventListener('click', initSimulation);

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        resize();
        initSimulation();
      }, 200);
    });

    createHeartSprites();
    resize();
    initSimulation();
    requestAnimationFrame(updateAndDraw);
  </script>
</body>
</html>
